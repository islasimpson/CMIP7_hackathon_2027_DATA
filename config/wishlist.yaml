# CMIP7 download wishlist
# -----------------------
# Each entry under `requests` asks for one or more CMIP7 *branded* variables
# for one or more experiments at a given frequency. `cmip7arch check` compares
# this list against the ESGF CMIP7 index; `cmip7arch update` fetches anything
# that is new or has a newer version. Edit freely; entries can be added,
# removed or commented out at any time.
#
# Fields
#   experiments : list of CMIP7 experiment_ids (e.g. historical, piControl,
#                 scen7-m, abrupt-4xCO2 ...)
#   frequency   : mon, day, 3hr, 6hr, 1hr, fx, yr ...
#   variables   : flat list of CMIP7 branded variable names, <root>_<branding>,
#                 e.g. tas_tavg-h2m-hxy-u. Write either [a, b, c] or one
#                 "- name" per line (not both). Shell-style wildcards are
#                 allowed: "tas_*" takes every branding of tas.
#   region      : optional, default glb (global). Non-global regions (e.g. ata,
#                 grl, 30S-90S) are stored under <table>-<region>.
#   members     : optional, default all.  An integer N keeps the first N
#                 members per model (sorted by r, i, p, f); a list keeps exactly
#                 those variant labels, e.g. [r1i1p1f1, r2i1p1f1].
#                 Can also be set per experiment:
#                   members: {default: all, piControl: 1}
#                 A per-experiment dict in a request extends the one in defaults.
#   models      : optional list of source_ids to restrict to (default: all).
#   exclude_models : optional list of source_ids to skip.
#
# Defaults applied to every request unless overridden in the request itself:
defaults:
  region: glb
  members:
    default: all        # all members for every experiment...
    piControl: 1        # ...except piControl: first member only

requests:
  # Near-surface air temperature
  - experiments: [historical, piControl, scen7-m]
    frequency: mon
    variables:
      - tas_tavg-h2m-hxy-u        # monthly mean (CMIP6 Amon/tas)
      - tas_tmaxavg-h2m-hxy-u     # monthly mean of daily max (CMIP6 Amon/tasmax)
      - tas_tminavg-h2m-hxy-u     # monthly mean of daily min (CMIP6 Amon/tasmin)

  # Precipitation
  - experiments: [historical, piControl, scen7-m]
    frequency: mon
    variables:
      - pr_tavg-u-hxy-u           # monthly mean (CMIP6 Amon/pr)

  # TOA and surface radiative fluxes, latent and sensible heat fluxes
  - experiments: [historical, piControl, scen7-m]
    frequency: mon
    variables: [rsdt_tavg-u-hxy-u, rsut_tavg-u-hxy-u, rlut_tavg-u-hxy-u,
                rsutcs_tavg-u-hxy-u, rlutcs_tavg-u-hxy-u, rtmt_tavg-u-hxy-u,
                rsds_tavg-u-hxy-u, rsus_tavg-u-hxy-u, rlds_tavg-u-hxy-u, rlus_tavg-u-hxy-u,
                rsdscs_tavg-u-hxy-u, rsuscs_tavg-u-hxy-u, rldscs_tavg-u-hxy-u,
                hfls_tavg-u-hxy-u, hfss_tavg-u-hxy-u]

  # Examples for later (uncomment / edit):
  # - experiments: [historical]
  #   frequency: day
  #   variables: ["tas_*"]          # every daily tas branding (tavg, tmax, tmin)
  #   members: [r1i1p1f1]
